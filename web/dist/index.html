<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MedMap recommends where to build a new hospital to reduce driving distance to care.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>MedMap</title>
  <script>
    // Apply the saved (or device) theme before anything draws, so dark mode
    // doesn't flash white on load. Same rules as src/theme.jsx.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("medmap-theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <script type="module" crossorigin src="/assets/index-LG4Dtqfp.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-B-KQJ6B5.css">
</head>
<body>
  <!-- React replaces everything inside #root once the app starts. -->
  <div id="root">
    <div class="boot" id="boot" style="font-family: system-ui, sans-serif; max-width: 640px; margin: 64px auto; padding: 0 20px; color: #0f172a;">
      <p>Loading MedMap…</p>
    </div>
  </div>
  <script>
    // Browsers won't run the app from a file:// page (and it needs the API
    // server anyway), so explain what to do instead of showing a blank page.
    if (location.protocol === "file:") {
      document.getElementById("boot").innerHTML =
        "<h1 style='font-size:28px'>Open MedMap through its server</h1>" +
        "<p>This page was opened as a file, which browsers don't allow for apps like this one.</p>" +
        "<ol style='line-height:1.8'>" +
        "<li>Double-click <b>web/start.cmd</b> (Windows), or build the frontend and run <code>python -m uvicorn optimal_hospital_placer.api.main:app --app-dir src --port 8000</code>.</li>" +
        "<li>Your browser opens <b>http://127.0.0.1:8000/</b> automatically once the data has loaded.</li>" +
        "</ol>" +
        "<p>See DEPLOYMENT.md for development, Docker, and hosted deployment instructions.</p>";
    }
  </script>
</body>
</html>
