# MedMap with Docker. Run these from the repo root.
#
#   docker compose -f docker/docker-compose.yml up --build
#       The whole demo on http://localhost:8000. Other devices on the same
#       network can use http://<this computer's IP>:8000.
#
#   docker compose -f docker/docker-compose.yml --profile dev up --build
#       Also starts the React dev server with hot reload on http://localhost:5173,
#       for editing web/src without installing Node on your computer.
#
#   docker compose -f docker/docker-compose.yml down
#
# On Windows, docker/run-env.ps1 wraps these commands.
# Settings (ports, cache size, OPTIMIZER_URL) go in docker/.env; see
# docker/.env.example. Every setting has a default, so .env is optional.

name: medmap

services:
  # The website and its JSON API, served by web/api/server.py.
  medmap:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: medmap:latest
    ports:
      - "${MEDMAP_PORT:-8000}:8000"
    environment:
      # Nationwide score tables are ~40 MB each; keep a few, not 16.
      MEDMAP_CACHE_SIZE: ${MEDMAP_CACHE_SIZE:-6}
      # Empty = the built-in placeholder scoring. Set it to another service's
      # address (e.g. http://algorithm:8000) to use that service instead.
      OPTIMIZER_URL: ${OPTIMIZER_URL:-}
    restart: unless-stopped

  # Hot-reload React dev server. Only starts with `--profile dev`.
  web-dev:
    profiles: ["dev"]
    image: node:24-slim
    working_dir: /web
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "${WEB_DEV_PORT:-5173}:5173"
    environment:
      # Vite forwards /api to the medmap container instead of localhost.
      API_PROXY_TARGET: http://medmap:8000
      # File-change events don't cross from a Windows/macOS host into the
      # container, so Vite polls for changes instead.
      VITE_USE_POLLING: "1"
    volumes:
      - ../web:/web
      # Linux packages live in this volume, separate from any Windows/macOS
      # node_modules on the host (their native binaries differ).
      - web-node-modules:/web/node_modules
    depends_on:
      medmap:
        condition: service_healthy

  # --- Adding the real algorithm later -------------------------------------
  # When /algorithm has its own API (see algorithm_prompt.txt) and a
  # Dockerfile, uncomment this and set OPTIMIZER_URL=http://algorithm:8000 in
  # docker/.env. The website then gets its scores from the algorithm; nothing
  # in web/ changes. It must serve GET /api/optimize with the same query
  # parameters and response shape as the placeholder (README: API reference).
  #
  # algorithm:
  #   build:
  #     context: ..
  #     dockerfile: algorithm/Dockerfile
  #   expose:
  #     - "8000"            # reachable by other containers only, not the host
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/optimize?k=1', timeout=10)"]
  #     interval: 30s
  #     start_period: 60s
  #
  # ...and add this under the medmap service so it starts after the algorithm:
  #   depends_on:
  #     algorithm:
  #       condition: service_healthy

volumes:
  web-node-modules:
